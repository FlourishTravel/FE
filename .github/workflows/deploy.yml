# Đã chuyển deploy sang VPS (deploy-vps.yml).
# Bật lại GitHub Pages chỉ khi cần mirror tĩnh.
name: Deploy to GitHub Pages (disabled)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: website/package-lock.json

      - name: Install & Build
        env:
          VITE_API_URL: https://flourishtravelapp.khanhtn45.id.vn/api
          VITE_BASE: /
        run: |
          cd website && npm ci && npm run build && touch dist/.nojekyll

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: website/dist
          force_orphan: true
