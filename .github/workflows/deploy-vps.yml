# Push main → SSH VPS → pull FE + rebuild container fe
name: Deploy FE to VPS

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-vps-fe
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -e
            cd ~/flourish

            if [ -d FE/.git ]; then
              cd FE
              git fetch origin
              git reset --hard origin/main || git reset --hard origin/master
              cd ..
            else
              echo "FE/.git not found"
              exit 1
            fi

            # Giữ VITE_API_URL production trên VPS (không ghi đè bằng .env local)
            echo 'VITE_API_URL=https://flourishtravelapp.khanhtn45.id.vn/api' > FE/website/.env

            docker compose up -d --build --force-recreate fe
            docker compose ps fe
            curl -sfI http://127.0.0.1:3000 | head -n 1
            echo "FE deploy OK"
