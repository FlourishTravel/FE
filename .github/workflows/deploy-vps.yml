# Build FE image on GitHub. VPS only docker load — npm on 2-core pegs CPU.
name: Deploy FE to VPS

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-vps-fe
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build website image on GitHub
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: |
          docker build \
            --build-arg VITE_API_URL=https://flourishtravelapp.khanhtn45.id.vn/api \
            --build-arg VITE_GOOGLE_CLIENT_ID="${VITE_GOOGLE_CLIENT_ID}" \
            -t flourish-fe:gha .

      - name: Save image
        run: docker save flourish-fe:gha | gzip -1 > flourish-fe.tar.gz

      - name: Clear leftover tarball on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set +e
            rm -f /tmp/flourish-fe.tar.gz
            sudo -n rm -f /tmp/flourish-fe.tar.gz
            mkdir -p "/tmp/flourish-gha-${{ github.run_id }}"
            chmod 755 "/tmp/flourish-gha-${{ github.run_id }}"

      - name: Copy image to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: flourish-fe.tar.gz
          target: /tmp/flourish-gha-${{ github.run_id }}
          timeout: 600s
          overwrite: true

      - name: Load image and start FE
        uses: appleboy/ssh-action@v1.2.0
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: VITE_GOOGLE_CLIENT_ID
          script_stop: true
          command_timeout: 20m
          script: |
            set -e
            mkdir -p /var/lock
            exec 9>/var/lock/flourish-deploy.lock
            flock -w 900 9

            cd ~/flourish

            docker ps --format '{{.ID}} {{.Image}}' | grep -iE 'node:|maven|buildkit' | awk '{print $1}' | xargs -r docker stop || true
            find /var/lib/docker/containers -name '*-json.log' -exec truncate -s 0 {} \; 2>/dev/null || true

            gzip -dc "/tmp/flourish-gha-${{ github.run_id }}/flourish-fe.tar.gz" | docker load
            docker tag flourish-fe:gha flourish-fe:latest
            docker tag flourish-fe:gha flourish-fe
            docker tag flourish-fe:gha flourish-fe-fe:latest || true
            docker tag flourish-fe:gha flourish_fe:latest || true
            docker compose config --images 2>/dev/null | grep -i fe | while read -r img; do
              docker tag flourish-fe:gha "$img" || true
            done
            rm -rf "/tmp/flourish-gha-${{ github.run_id }}"
            rm -f /tmp/flourish-fe.tar.gz

            if [ -d FE/.git ]; then
              cd FE
              git fetch origin || true
              git reset --hard origin/main || git reset --hard origin/master || true
              cd ..
            fi

            if [ -z "${VITE_GOOGLE_CLIENT_ID}" ] && [ -f .env ]; then
              VITE_GOOGLE_CLIENT_ID=$(grep -E '^VITE_GOOGLE_CLIENT_ID=' .env | cut -d= -f2- || true)
            fi

            printf '%s\n' \
              'VITE_API_URL=https://flourishtravelapp.khanhtn45.id.vn/api' \
              "VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}" \
              > FE/website/.env

            touch .env
            grep -q '^VITE_API_URL=' .env \
              && sed -i 's|^VITE_API_URL=.*|VITE_API_URL=https://flourishtravelapp.khanhtn45.id.vn/api|' .env \
              || echo 'VITE_API_URL=https://flourishtravelapp.khanhtn45.id.vn/api' >> .env

            docker compose up -d --no-build --force-recreate fe
            docker compose ps fe
            docker image prune -f || true

            if [ -d /etc/nginx/conf.d ] && [ -f FE/deploy/host-nginx-proxy.conf ]; then
              cp FE/deploy/host-nginx-proxy.conf /etc/nginx/conf.d/flourish-proxy-buffers.conf
              NGINX_USER=$(awk '$1=="user"{gsub(/;/,""); print $2; exit}' /etc/nginx/nginx.conf 2>/dev/null || true)
              NGINX_USER=${NGINX_USER:-www-data}
              chown -R "${NGINX_USER}:${NGINX_USER}" /var/lib/nginx /var/cache/nginx 2>/dev/null || true
              nginx -t
              systemctl reload nginx
            fi

            ok=0
            for i in $(seq 1 20); do
              if curl -sfI http://127.0.0.1:3000 >/dev/null 2>&1; then
                ok=1
                break
              fi
              echo "Waiting for FE... ($i/20)"
              sleep 2
            done
            if [ "$ok" != "1" ]; then
              echo "FE health check failed"
              docker compose logs fe --tail 40
              exit 1
            fi
            echo "FE deploy OK"
