# Push main → SSH VPS → pull FE + rebuild container fe
name: Deploy FE to VPS

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-vps-fe
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: VITE_GOOGLE_CLIENT_ID
          script_stop: true
          command_timeout: 30m
          script: |
            set -e
            cd ~/flourish

            if [ -d FE/.git ]; then
              cd FE
              git fetch origin
              git reset --hard origin/main || git reset --hard origin/master
              cd ..
            else
              echo "FE/.git not found"
              exit 1
            fi

            # Prefer org/repo secret; fallback to VPS ~/flourish/.env
            if [ -z "${VITE_GOOGLE_CLIENT_ID}" ] && [ -f .env ]; then
              VITE_GOOGLE_CLIENT_ID=$(grep -E '^VITE_GOOGLE_CLIENT_ID=' .env | cut -d= -f2- || true)
            fi

            printf '%s\n' \
              'VITE_API_URL=https://flourishtravelapp.khanhtn45.id.vn/api' \
              "VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}" \
              > FE/website/.env

            touch .env
            grep -q '^VITE_API_URL=' .env \
              && sed -i 's|^VITE_API_URL=.*|VITE_API_URL=https://flourishtravelapp.khanhtn45.id.vn/api|' .env \
              || echo 'VITE_API_URL=https://flourishtravelapp.khanhtn45.id.vn/api' >> .env

            if [ -n "${VITE_GOOGLE_CLIENT_ID}" ]; then
              grep -q '^VITE_GOOGLE_CLIENT_ID=' .env \
                && sed -i "s|^VITE_GOOGLE_CLIENT_ID=.*|VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}|" .env \
                || echo "VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}" >> .env
            fi

            if ! grep -q 'VITE_GOOGLE_CLIENT_ID' docker-compose.yml; then
              sed -i '/VITE_API_URL: \${VITE_API_URL}/a\        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}' docker-compose.yml
            fi

            docker compose up -d --build --force-recreate fe
            docker compose ps fe
            curl -sfI http://127.0.0.1:3000 | head -n 1
            echo "FE deploy OK"
