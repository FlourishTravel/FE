# Push main → SSH VPS → pull FE + rebuild container fe
name: Deploy FE to VPS

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-vps-fe
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: VITE_GOOGLE_CLIENT_ID
          script_stop: true
          command_timeout: 30m
          script: |
            set -e
            cd ~/flourish

            echo "=== disk before cleanup ==="
            df -h /
            docker builder prune -af || true
            docker image prune -af || true
            echo "=== disk after cleanup ==="
            df -h /

            if [ -d FE/.git ]; then
              cd FE
              git fetch origin
              git reset --hard origin/main || git reset --hard origin/master
              cd ..
            else
              echo "FE/.git not found"
              exit 1
            fi

            # Prefer org/repo secret; fallback to VPS ~/flourish/.env
            if [ -z "${VITE_GOOGLE_CLIENT_ID}" ] && [ -f .env ]; then
              VITE_GOOGLE_CLIENT_ID=$(grep -E '^VITE_GOOGLE_CLIENT_ID=' .env | cut -d= -f2- || true)
            fi

            printf '%s\n' \
              'VITE_API_URL=https://flourishtravelapp.khanhtn45.id.vn/api' \
              "VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}" \
              > FE/website/.env

            touch .env
            grep -q '^VITE_API_URL=' .env \
              && sed -i 's|^VITE_API_URL=.*|VITE_API_URL=https://flourishtravelapp.khanhtn45.id.vn/api|' .env \
              || echo 'VITE_API_URL=https://flourishtravelapp.khanhtn45.id.vn/api' >> .env

            if [ -n "${VITE_GOOGLE_CLIENT_ID}" ]; then
              grep -q '^VITE_GOOGLE_CLIENT_ID=' .env \
                && sed -i "s|^VITE_GOOGLE_CLIENT_ID=.*|VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}|" .env \
                || echo "VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}" >> .env
            fi

            if ! grep -q 'VITE_GOOGLE_CLIENT_ID' docker-compose.yml; then
              sed -i '/VITE_API_URL: \${VITE_API_URL}/a\        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}' docker-compose.yml
            fi

            docker compose up -d --build --force-recreate fe
            docker compose ps fe

            # Host nginx (1.18) was truncating /assets/*.js|css at ~128KB because
            # proxy_buffers spilled to proxy_temp. Stream the body instead.
            if [ -d /etc/nginx/conf.d ] && [ -f FE/deploy/host-nginx-proxy.conf ]; then
              cp FE/deploy/host-nginx-proxy.conf /etc/nginx/conf.d/flourish-proxy-buffers.conf
              NGINX_USER=$(awk '$1=="user"{gsub(/;/,""); print $2; exit}' /etc/nginx/nginx.conf 2>/dev/null || true)
              NGINX_USER=${NGINX_USER:-www-data}
              chown -R "${NGINX_USER}:${NGINX_USER}" /var/lib/nginx /var/cache/nginx 2>/dev/null || true
              nginx -t
              systemctl reload nginx
            fi

            ok=0
            for i in $(seq 1 20); do
              if curl -sfI http://127.0.0.1:3000 >/dev/null 2>&1; then
                ok=1
                break
              fi
              echo "Waiting for FE... ($i/20)"
              sleep 2
            done
            if [ "$ok" != "1" ]; then
              echo "FE health check failed"
              docker compose logs fe --tail 40
              exit 1
            fi

            JS=$(curl -sS http://127.0.0.1:3000/ | grep -oE '/assets/index-[^"[:space:]]+\.js' | head -1)
            if [ -n "$JS" ]; then
              HDR=$(curl -sSI "http://127.0.0.1:3000${JS}" | tr -d '\r')
              CL=$(printf '%s\n' "$HDR" | awk -F': ' 'tolower($1)=="content-length"{print $2; exit}')
              SZ=$(curl -sS "http://127.0.0.1:3000${JS}" | wc -c)
              echo "FE asset ${JS} Content-Length=${CL} downloaded=${SZ}"
              if [ -n "$CL" ] && [ "$CL" -gt 0 ] && [ "$SZ" -ne "$CL" ]; then
                echo "FE container truncated ${JS}"
                exit 1
              fi
              PUB="https://flourishtravelapp.khanhtn45.id.vn${JS}"
              PHDR=$(curl -sSI "$PUB" | tr -d '\r')
              PCL=$(printf '%s\n' "$PHDR" | awk -F': ' 'tolower($1)=="content-length"{print $2; exit}')
              PSZ=$(curl -sS "$PUB" | wc -c)
              echo "Public asset ${PUB} Content-Length=${PCL} downloaded=${PSZ}"
              if [ -n "$PCL" ] && [ "$PCL" -gt 0 ] && [ "$PSZ" -ne "$PCL" ]; then
                echo "Host nginx still truncating ${JS} — check /etc/nginx and proxy_temp"
                exit 1
              fi
            fi
            echo "FE deploy OK"
