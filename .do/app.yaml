# DigitalOcean App Platform — repo GitHub "FE" (Vite/React + nginx)
# Push Dockerfile + file này lên main → Apps → chọn repo FE (hoặc Update App Spec).
name: flourish-travel-fe
region: sgp
ingress:
  rules:
    - component:
        name: web
      match:
        path:
          prefix: /
services:
  - name: web
    dockerfile_path: Dockerfile
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    envs:
      - key: VITE_API_URL
        scope: BUILD_TIME
        value: https://flourishtravel-rtdye.ondigitalocean.app/api
      - key: VITE_BASE
        scope: BUILD_TIME
        value: /
