# DigitalOcean App Platform — Static Site (Vite SPA → CDN)
#
# QUAN TRỌNG: Component phải là Static Site, KHÔNG phải Web Service.
# Apps → Settings → App Spec → Edit → dán spec này → Save → Force Rebuild (Clear cache)
#
# Chỉ giữ env BUILD_TIME: VITE_API_URL, VITE_BASE — xóa env BE (DB_*, JWT_*, MOMO_*, ...).
name: flourish-travel-fe
region: sgp
ingress:
  rules:
    - component:
        name: web
      match:
        path:
          prefix: /
static_sites:
  - name: web
    source_dir: website
    environment_slug: node-js
    build_command: npm ci --include=dev && npm run build
    output_dir: dist
    index_document: index.html
    catchall_document: index.html
    envs:
      - key: VITE_API_URL
        scope: BUILD_TIME
        value: https://flourishtravel-rtdye.ondigitalocean.app/api
      - key: VITE_BASE
        scope: BUILD_TIME
        value: /
      - key: NODE_OPTIONS
        scope: BUILD_TIME
        value: --max-old-space-size=2048
