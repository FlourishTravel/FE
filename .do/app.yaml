# DigitalOcean App Platform — repo GitHub "FE" (Vite/React trong website/)
# Push file này lên main → Apps → Create App → chọn repo FE → App Spec.
name: flourish-travel-fe
region: sgp
ingress:
  rules:
    - component:
        name: web
      match:
        path:
          prefix: /
static_sites:
  - name: web
    source_dir: website
    build_command: npm ci && npm run build
    output_dir: dist
    index_document: index.html
    catchall_document: index.html
    envs:
      - key: VITE_API_URL
        value: https://flourishtravel-rtdye.ondigitalocean.app/api
      - key: VITE_BASE
        value: /
