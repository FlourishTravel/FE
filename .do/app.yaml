# DigitalOcean App Platform — repo GitHub "FE" (Vite/React + nginx)
#
# QUAN TRỌNG: Component phải dùng Dockerfile, KHÔNG dùng Buildpack.
# Apps → Settings → App Spec → Save (hoặc Edit component → Dockerfile path: Dockerfile)
#
# Chỉ giữ env BUILD_TIME: VITE_API_URL, VITE_BASE — xóa env BE (DB_*, JWT_*, MOMO_*, ...).
name: flourish-travel-fe
region: sgp
ingress:
  rules:
    - component:
        name: web
      match:
        path:
          prefix: /
services:
  - name: web
    dockerfile_path: Dockerfile
    source_dir: /
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /
      initial_delay_seconds: 10
      period_seconds: 10
      timeout_seconds: 5
      failure_threshold: 3
    envs:
      - key: VITE_API_URL
        scope: BUILD_TIME
        value: https://flourishtravel-rtdye.ondigitalocean.app/api
      - key: VITE_BASE
        scope: BUILD_TIME
        value: /
