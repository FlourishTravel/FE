server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Chrome Range + gzip often yields 206 with a Content-Length that does not
    # match the body → net::ERR_CONTENT_LENGTH_MISMATCH on hashed Vite files.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Fingerprinted build output: cache forever, never serve partial gzip bodies.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        max_ranges 0;
        gzip off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
